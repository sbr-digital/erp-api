name: Security Check (PR & Push)

on:
  pull_request:
    branches: [homolog, main]
  push:
    branches: [homolog, main]

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9.15.2'

jobs:
  security-check:
    name: 🔍 Quick Security Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: 🧹 Clean workspace and configure pnpm
        run: |
          rm -rf node_modules .pnpm-store .tmp .npm
          mkdir -p .pnpm-store .tmp .npm
          pnpm config set side-effects-cache-read false
          pnpm config set side-effects-cache-write false
          pnpm config set store-dir .pnpm-store
          pnpm config set shamefully-hoist true
          echo "TMPDIR=$GITHUB_WORKSPACE/.tmp" >> $GITHUB_ENV
          echo "npm_config_cache=$GITHUB_WORKSPACE/.npm" >> $GITHUB_ENV

      - name: 📦 Install Dependencies (stable, scripts off)
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: 🔧 Rebuild (run postinstall scripts)
        run: pnpm rebuild

      - name: 🔍 Security Audit
        run: pnpm audit --audit-level=high || true
