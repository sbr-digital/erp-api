name: Running CI/CD
on:
  push:
    branches:
      - homolog

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4

      - name: Install pnpm 📦
        run: npm install -g pnpm@9.15.2

      - name: version pnpm 📦
        run: pnpm -v

      - name: Create pnpm cache directory
        run: mkdir -p ~/.pnpm-store

      - name: Cache dependencies 💾
        id: cache-pnpm
        uses: actions/cache@v4
        env:
          cache-name: cache-pnpm
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.pnpm-store
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: List the state of node modules
        if: ${{ steps.cache-pnpm.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: pnpm  list

      - name: Install dependencies 📦
        run: pnpm install

      # Security check first - fail fast if vulnerabilities found
      - name: Security Audit 🔒
        id: security
        run: |
          echo "Running security audit..."
          
          if pnpm audit --audit-level=high --json > audit-result.json 2>/dev/null; then
            echo "No high/critical vulnerabilities found"
            echo "security-status=passed" >> $GITHUB_OUTPUT
          else
            echo "High/Critical vulnerabilities found"
            echo "security-status=failed" >> $GITHUB_OUTPUT
            
            if [ -f "audit-result.json" ] && [ -s "audit-result.json" ]; then
              CRITICAL=$(cat audit-result.json | jq -r '.metadata.vulnerabilities.critical // 0')
              HIGH=$(cat audit-result.json | jq -r '.metadata.vulnerabilities.high // 0')
              
              echo "## 🚨 Security Issues Found" >> $GITHUB_STEP_SUMMARY
              echo "- Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
              echo "- High: $HIGH" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Build will continue but please address these vulnerabilities.">> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Run Lint 📎
        run: pnpm run lint

      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ${{ secrets.AWS_REGION }}

      - name: Copy files to S3
        run: |
          ${{ secrets.S3_FILES }}

      - name: Generate Prisma Client ⚙️
        run: npx prisma generate

      - name: Run Tests 🧪
        run: pnpm run test

      - name: Build Application 🛠️
        run: pnpm run build

      # Final security summary
      - name: Security Summary 📋
        if: always()
        run: |
          if [ "${{ steps.security.outputs.security-status }}" = "failed" ]; then
            echo "⚠️  Security vulnerabilities detected but build completed."
            echo "Please check the Security Audit step above for details."
            echo "Consider running the Security Audit workflow for automated fixes."
          else
            echo "✅ No high/critical security vulnerabilities found."
          fi

