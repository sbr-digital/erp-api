name: Running CI/CD
on:
  push:
    branches:
      - homolog

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4

      - name: Install pnpm 📦
        run: npm install -g pnpm@9.15.2

      - name: pnpm config hardening
        run: |
          pnpm config set side-effects-cache-read false
          pnpm config set side-effects-cache-write false
          pnpm config set store-dir .pnpm-store

      - name: Install dependencies 📦
        run: |
          if ! pnpm install --frozen-lockfile 2>/dev/null; then
            echo "Lockfile mismatch detected, updating..."
            rm -f pnpm-lock.yaml
            pnpm install --no-frozen-lockfile
            echo "Lockfile updated successfully"
          else
            echo "Lockfile is up to date"
          fi

      - name: Run Lint 📎
        run: pnpm run lint

      - name: Generate Prisma Client ⚙️
        run: npx prisma generate

      - name: Run Tests 🧪
        run: pnpm run test

      - name: Build Application 🛠️
        run: pnpm run build

      - name: Security Audit 🔒
        run: pnpm audit --audit-level=high || true
