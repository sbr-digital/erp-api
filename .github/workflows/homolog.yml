name: Running CI/CD
on:
  push:
    branches:
      - homolog

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4

      - name: Install pnpm 📦
        run: npm install -g pnpm@9.15.2

      - name: 🧹 Clean workspace and configure pnpm
        run: |
          rm -rf node_modules .pnpm-store .tmp
          mkdir -p .pnpm-store .tmp
          pnpm config set side-effects-cache-read false
          pnpm config set side-effects-cache-write false
          pnpm config set store-dir .pnpm-store
          echo "TMPDIR=$GITHUB_WORKSPACE/.tmp" >> $GITHUB_ENV

      - name: Install dependencies (stable) 📦
        run: pnpm install --no-frozen-lockfile

      - name: Run Lint 📎
        run: pnpm run lint

      - name: Generate Prisma Client ⚙️
        run: npx prisma generate

      - name: Run Tests 🧪
        run: pnpm run test

      - name: Build Application 🛠️
        run: pnpm run build

      - name: Security Audit 🔒
        run: pnpm audit --audit-level=high || true
