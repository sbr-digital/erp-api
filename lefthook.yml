prepare-commit-msg:
  commands:
    verify-imports:
      run: pnpm run verify-imports      
    audit-libs:
      run: pnpm audit --prod --audit-level high
    lint:
      run: pnpm run lint
    unit-tests:
      run: pnpm run test
    e2e-tests:
      run: pnpm run test:e2e
    commitzen:
      interactive: true
      run: npx cz
      env:
        LEFTHOOK: 0


